services:
  app:
    build: .
    image: tegad-fechamento:latest
    container_name: tegad-fechamento
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5001}:5001"
    env_file:
      - .env          # SECRET_KEY, DATABASE_URL (PostgreSQL externo), MAX_UPLOAD_MB
    environment:
      PORT: "5001"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      RUN_MIGRATIONS: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
